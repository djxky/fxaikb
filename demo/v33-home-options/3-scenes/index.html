<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞象 AI · 方案 3 · 任务接续（对话 + 最近任务 + 内容流）</title>
<style>
  :root{
    --bg:#f6f3ed;
    --side:#f1eee7;
    --surface:#fffefa;
    --surface-2:#fbfaf6;
    --ink:#1f1f1d;
    --muted:#77716a;
    --faint:#aaa39a;
    --line:#e6e0d6;
    --line-strong:#d5cab8;
    --gold:#a87e2c;
    --gold-soft:#f3ead7;
    --green:#537260;
    --green-soft:#e8efe9;
    --blue:#64758f;
    --blue-soft:#e5ebf3;
    --purple:#7c5b8a;
    --purple-soft:#ece5ef;
    --rose:#a86a72;
    --rose-soft:#f3e2e4;
    --shadow:0 22px 52px -36px rgba(45,38,27,.42);
    --card-shadow:0 10px 24px -20px rgba(45,38,27,.3);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Source Han Sans SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  button,textarea{font:inherit}
  button{border:0;background:none;color:inherit;cursor:pointer}

  .app{height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);overflow:hidden}

  /* 侧栏 v29 风格 */
  .sidebar{
    min-width:0;background:var(--side);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:14px 10px;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:7px 8px 18px;font-weight:650}
  .brand-mark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--ink);color:#fffefa;font-size:12px}
  .brand-sub{color:var(--muted);font-size:12px;font-weight:500;margin-left:auto}
  .new-chat{height:36px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:8px;background:var(--ink);color:#fffefa;font-weight:560;margin:0 2px 12px}
  .nav-section{margin-top:8px}
  .nav-title{padding:8px 9px 5px;font-size:11px;color:var(--faint);font-weight:650}
  .nav-item{width:100%;min-height:34px;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:#45413c;font-size:13px;text-align:left}
  .nav-item:hover{background:#e9e4db}
  .nav-item.active{background:#ebe2d0;color:var(--ink);font-weight:600}
  .nav-item svg{flex:0 0 auto;color:#807970}
  .nav-item.active svg{color:var(--gold)}
  .nav-count{margin-left:auto;color:var(--faint);font-size:11px}
  .side-spacer{flex:1}
  .school-chip{margin:8px 2px 10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.38)}
  .school-name{font-size:13px;font-weight:620}
  .school-meta{margin-top:2px;color:var(--muted);font-size:12px}
  .user{border-top:1px solid var(--line);padding:11px 8px 2px;display:flex;align-items:center;gap:9px}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#d9d1c2;color:#554d43;font-weight:650}
  .user-name{font-size:13px;font-weight:560}
  .user-role{font-size:11px;color:var(--muted);margin-top:1px}

  /* 主区 */
  .main{
    min-width:0;height:100vh;overflow:auto;
    overflow-anchor:none; /* 关键：禁用 scroll anchoring，避免 hero 折叠时 scrollTop 自动跳动 */
    background:
      linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 180px),
      var(--bg);
  }
  .topbar{
    position:sticky;top:0;z-index:6;
    background:rgba(246,243,237,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    height:58px;display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;border-bottom:1px solid rgba(230,224,214,.7);
  }
  .crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .crumb strong{color:var(--ink);font-weight:620}
  .top-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
  .icon-btn:hover{background:#ece7dd;color:var(--ink)}
  .quota{height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.54);border:1px solid var(--line);color:var(--muted);font-size:12px}
  .quota-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

  /* 上半：保留 v29 极简对话起手 */
  .stage-top{
    width:min(820px,calc(100% - 56px));
    margin:42px auto 0;
    transition:max-height .42s ease, opacity .28s ease, margin .35s ease, transform .35s ease;
    overflow:hidden;
    max-height:520px;
    transform-origin:top center;
  }
  .main.scrolled .stage-top{
    max-height:0;
    opacity:0;
    margin-top:0;
    margin-bottom:0;
    transform:scaleY(.96);
    pointer-events:none;
  }
  .hero{margin-bottom:18px}
  h1{margin:0;font-size:28px;font-weight:580;line-height:1.28}
  .composer{
    position:relative;background:var(--surface);
    border:1px solid var(--line-strong);border-radius:18px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  textarea{
    width:100%;min-height:96px;
    padding:20px 18px 12px;
    border:0;resize:none;outline:0;background:transparent;
    color:var(--ink);font-size:16px;line-height:1.55;
  }
  textarea::placeholder{color:#aaa299}
  .composer-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #f0ece4;padding:10px 12px}
  .composer-tools{display:flex;align-items:center;gap:4px}
  .tool-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
  .tool-btn:hover{background:#f1eee7;color:var(--ink)}
  .reference-note{
    display:inline-flex;align-items:center;gap:6px;
    height:30px;padding:0 10px;
    border:1px solid #e6dcc2;border-radius:8px;
    background:var(--gold-soft);
    color:var(--gold);
    font-size:12.5px;font-weight:540;
    cursor:pointer;
    transition:all .12s ease;
  }
  .reference-note:hover{background:#ecdfba;border-color:#d4bf86}
  .reference-note svg{color:var(--gold)}
  .reference-note .chev{opacity:.65}
  .send{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:#fffefa;background:var(--ink)}

  .quick-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
  .quick-kicker{width:100%;color:var(--muted);font-size:12px;margin:2px 0 1px}
  .quick{min-height:32px;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.5);color:#48433d;font-size:13px}
  .quick:hover{border-color:#cbbb9d;background:#fffefa}
  .quick svg{color:var(--gold)}

  /* 下半：内容浏览（4 列瀑布流，参考飞象老师 c 端） */
  .stream-section{
    margin-top:38px;padding-bottom:80px;
    width:min(1180px,calc(100% - 56px));
    margin-left:auto;margin-right:auto;
  }

  /* 来源 tabs：跨学科/来源切换（吸顶） */
  .filter-bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;
    margin-bottom:22px;
    padding:14px 0;
    border-bottom:1px solid rgba(230,224,214,.7);
    position:sticky;
    top:58px;
    z-index:5;
    background:rgba(246,243,237,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:box-shadow .25s ease, padding .25s ease;
  }
  .main.scrolled .filter-bar{
    box-shadow:0 6px 18px -16px rgba(45,38,27,.4);
    padding-top:12px;padding-bottom:12px;
  }
  .main.scrolled .stream-section{margin-top:0}
  .tabs{
    display:flex;align-items:center;gap:2px;
    overflow-x:auto;
    scrollbar-width:none;
    flex:1;min-width:0;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:99px;
    color:var(--muted);
    font-size:13.5px;font-weight:500;
    transition:all .15s ease;
    position:relative;
  }
  .tab:hover{color:var(--ink);background:#f1eee7}
  .tab.active{
    color:var(--ink);font-weight:650;
    background:#ebe2d0;
  }
  .tab .tab-badge{
    margin-left:5px;
    padding:1px 6px;border-radius:99px;
    font-size:10.5px;
    background:rgba(168,126,44,.16);color:var(--gold);
    font-weight:600;
  }
  .filter-search{
    flex:0 0 auto;
    width:200px;
    height:32px;
    display:flex;align-items:center;gap:7px;
    padding:0 12px;
    border:1px solid var(--line);border-radius:99px;
    background:rgba(255,254,250,.5);
    color:var(--muted);font-size:12.5px;
  }
  .filter-search svg{color:var(--faint);flex:0 0 auto}
  .filter-search input{
    border:0;outline:0;background:transparent;
    flex:1;min-width:0;
    color:var(--ink);font:inherit;
  }

  /* 4 列瀑布流 */
  .content-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
  }

  /* 卡片视觉：封面占比加大、字号加大、加作者 */
  .card{
    background:var(--surface);
    border:1px solid rgba(230,224,214,.7);
    border-radius:14px;
    box-shadow:0 1px 3px rgba(45,38,27,.04);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    text-align:left;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 32px -22px rgba(45,38,27,.3);
    border-color:#cbbb9d;
  }
  .card-cover{
    height:148px; /* 4 列瀑布流封面再大一些 */
    background:linear-gradient(135deg,#e8d8b3,#f3ead7);
    position:relative;
    overflow:hidden;
  }
  .card-cover.blue{background:linear-gradient(135deg,#bccddc,#dee7f0)}
  .card-cover.green{background:linear-gradient(135deg,#bdd1c1,#dde7e0)}
  .card-cover.purple{background:linear-gradient(135deg,#ccb8d3,#e4daea)}
  .card-cover.rose{background:linear-gradient(135deg,#d8bbc0,#ebd5d8)}
  .card-cover.ink{background:linear-gradient(135deg,#2c2925,#46413a)}
  /* 封面装饰大字 */
  .card-cover-glyph{
    position:absolute;
    right:-8px;bottom:-22px;
    font-size:88px;
    font-weight:700;
    color:rgba(31,31,29,.07);
    line-height:1;
    letter-spacing:-.04em;
    user-select:none;
    pointer-events:none;
  }
  .card-cover.ink .card-cover-glyph{color:rgba(255,254,250,.07)}
  .card-tag{
    position:absolute;top:10px;left:10px;
    font-size:10.5px;font-weight:600;letter-spacing:.2px;
    padding:3px 8px;border-radius:6px;
    background:rgba(255,254,250,.88);color:#3f3a32;
    backdrop-filter:blur(6px);
  }
  .card-tag.gold{color:var(--gold)}
  .card-tag.dark{background:rgba(31,31,29,.78);color:#fffefa}

  .card-body{
    padding:13px 14px 14px;
    display:flex;flex-direction:column;gap:6px;flex:1;
  }
  .card-title{
    font-size:14.5px;font-weight:650;
    line-height:1.42;color:var(--ink);
    letter-spacing:-.005em;
    display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
    min-height:42px;
  }
  .card-meta{
    margin-top:auto;
    color:var(--muted);font-size:11.5px;
    padding-top:8px;
    display:flex;align-items:center;gap:6px;
  }
  .card-meta .dot{width:3px;height:3px;border-radius:50%;background:#c5bcab;flex:0 0 3px}

  /* 作者行（第 2 行"别的老师"专用，更社交感） */
  .card-author{
    margin-top:auto;
    padding-top:10px;
    display:flex;align-items:center;gap:7px;
    color:var(--muted);font-size:11.5px;
  }
  .author-avatar{
    width:20px;height:20px;border-radius:50%;
    display:grid;place-items:center;
    background:#d9d1c2;color:#554d43;
    font-size:10px;font-weight:650;
    flex:0 0 20px;
  }
  .author-avatar.green{background:#cee0d2;color:var(--green)}
  .author-avatar.blue{background:#cdd9e5;color:var(--blue)}
  .author-avatar.purple{background:#d6c4dd;color:var(--purple)}
  .author-avatar.gold{background:var(--gold);color:#fffefa}
  .card-author-name{font-weight:560;color:#5a544b}
  .card-stat{
    margin-left:auto;
    display:inline-flex;align-items:center;gap:4px;
    color:var(--faint);
  }
  .card-stat svg{width:11px;height:11px}

  /* 响应式 */
  @media (max-width:1080px){
    .content-grid{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:780px){
    .content-grid{grid-template-columns:repeat(2,1fr)}
  }

  /* ===== 方案 5 新增 ===== */
  .hero-sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.55}
  .hero-sub b{color:var(--ink);font-weight:600}

  /* 中部：最近任务（事件接续 · 老师"刚才在干嘛"） */
  .recent-section{
    width:min(1180px,calc(100% - 56px));
    margin:30px auto 0;
    transition:max-height .42s ease, opacity .28s ease, margin .35s ease;
    overflow:hidden;
    max-height:240px;
  }
  .main.scrolled .recent-section{
    max-height:0;opacity:0;margin-top:0;margin-bottom:0;pointer-events:none;
  }
  .recent-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 4px 12px;
  }
  .recent-title{
    display:inline-flex;align-items:center;gap:9px;
    font-size:14px;font-weight:640;color:var(--ink);
    letter-spacing:-.005em;
  }
  .recent-title-dot{
    width:7px;height:7px;border-radius:50%;background:var(--rose);
    box-shadow:0 0 0 3px rgba(168,106,114,.18);
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{box-shadow:0 0 0 3px rgba(168,106,114,.18)}
    50%{box-shadow:0 0 0 5px rgba(168,106,114,.08)}
  }
  .recent-title-meta{
    color:var(--muted);font-size:12.5px;font-weight:500;
    letter-spacing:0;margin-left:2px;
  }
  .recent-more{
    color:var(--muted);font-size:12.5px;
    display:inline-flex;align-items:center;gap:3px;
  }
  .recent-more:hover{color:var(--ink)}
  .recent-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
  }
  .recent-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px 12px 16px;
    display:flex;flex-direction:column;gap:7px;
    position:relative;overflow:hidden;
    text-align:left;
    transition:all .18s ease;
    box-shadow:0 1px 3px rgba(45,38,27,.04);
    min-height:138px;
  }
  .recent-card::before{
    content:"";
    position:absolute;left:0;top:0;bottom:0;
    width:3px;background:var(--gold);
  }
  .recent-card.rose::before{background:var(--rose)}
  .recent-card.blue::before{background:var(--blue)}
  .recent-card.green::before{background:var(--green)}
  .recent-card.purple::before{background:var(--purple)}
  .recent-card:hover{
    transform:translateY(-2px);
    border-color:#cbbb9d;
    box-shadow:0 14px 30px -18px rgba(45,38,27,.28);
  }
  .recent-tag{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;letter-spacing:.02em;
    color:var(--gold);
  }
  .recent-card.rose .recent-tag{color:var(--rose)}
  .recent-card.blue .recent-tag{color:var(--blue)}
  .recent-card.green .recent-tag{color:var(--green)}
  .recent-card.purple .recent-tag{color:var(--purple)}
  .recent-tag .tag-dot{
    width:4px;height:4px;border-radius:50%;
    background:currentColor;
  }
  .recent-headline{
    font-size:13.5px;font-weight:620;color:var(--ink);
    line-height:1.42;letter-spacing:-.005em;
    display:-webkit-box;
    -webkit-line-clamp:2;line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .recent-stat{
    font-size:11.5px;color:var(--muted);
    margin-top:auto;
    display:flex;align-items:baseline;gap:5px;
    flex-wrap:wrap;
  }
  .recent-stat .big{
    color:var(--ink);font-weight:680;
    font-size:14px;letter-spacing:-.01em;
  }
  .recent-card.rose .recent-stat .big{color:var(--rose)}
  .recent-card.blue .recent-stat .big{color:var(--blue)}
  .recent-card.green .recent-stat .big{color:var(--green)}
  .recent-stat .when{
    margin-left:auto;color:var(--faint);font-size:11px;
  }
  /* 兜底入口卡：扫描 / 创建新任务 */
  .recent-card.entry{
    border:1px dashed var(--line-strong);
    background:transparent;
    box-shadow:none;
    justify-content:center;
    align-items:flex-start;
  }
  .recent-card.entry::before{display:none}
  .recent-card.entry .entry-icon{
    width:34px;height:34px;border-radius:10px;
    display:grid;place-items:center;
    background:rgba(168,126,44,.1);color:var(--gold);
    margin-bottom:6px;
  }
  .recent-card.entry .entry-title{
    font-size:13.5px;font-weight:640;color:var(--ink);
    line-height:1.4;
  }
  .recent-card.entry .entry-desc{
    font-size:11.5px;color:var(--muted);
    margin-top:3px;line-height:1.4;
  }
  .recent-card.entry:hover{
    border-color:#cbbb9d;background:rgba(255,254,250,.5);
    transform:translateY(-2px);
  }

  @media (max-width:1180px){
    .recent-grid{grid-template-columns:repeat(4,1fr)}
    .recent-card.entry{display:none}
  }
  @media (max-width:880px){
    .recent-grid{grid-template-columns:repeat(2,1fr)}
    .recent-section{max-height:none}
  }

  /* 底部浮动对话框：scrolled 时出现 */
  .float-composer{
    position:fixed;
    bottom:74px; /* 给底部 vswitch 让位 */
    left:calc(50% + 124px); /* 修正 248px sidebar 偏移 */
    transform:translateX(-50%) translateY(28px);
    width:min(720px,calc(100vw - 320px));
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:16px;
    box-shadow:0 24px 64px -28px rgba(45,38,27,.5),0 2px 6px rgba(45,38,27,.06);
    display:flex;align-items:center;gap:6px;
    padding:9px 9px 9px 16px;
    opacity:0;pointer-events:none;
    transition:opacity .28s ease, transform .32s cubic-bezier(.22,1,.36,1);
    z-index:200;
  }
  body.scrolled .float-composer{
    opacity:1;pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  .float-composer input{
    flex:1;min-width:0;
    border:0;outline:0;background:transparent;
    color:var(--ink);font:inherit;font-size:14.5px;
    padding:8px 0;
  }
  .float-composer input::placeholder{color:#aaa299}
  .float-composer .fc-attach,
  .float-composer .fc-mic{
    width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;
    color:var(--muted);
    transition:all .12s ease;
  }
  .float-composer .fc-attach:hover,
  .float-composer .fc-mic:hover{background:#f1eee7;color:var(--ink)}
  .float-composer .fc-send{
    width:36px;height:36px;border-radius:10px;
    background:var(--ink);color:#fffefa;
    display:grid;place-items:center;
    transition:all .12s ease;
  }
  .float-composer .fc-send:hover{background:#000;transform:scale(1.04)}
  .float-composer .fc-chips{
    display:flex;align-items:center;gap:5px;
    padding:0 6px 0 0;
    margin-right:4px;
    border-right:1px solid var(--line);
  }
  .fc-chip{
    flex:0 0 auto;
    padding:4px 10px;border-radius:99px;
    background:rgba(168,126,44,.1);color:var(--gold);
    font-size:12px;font-weight:540;
  }
  .fc-chip:hover{background:rgba(168,126,44,.18)}
  @media (max-width:860px){
    .float-composer{
      left:50%;width:calc(100vw - 32px);
      bottom:64px;
    }
    .float-composer .fc-chips{display:none}
  }

  .toast{
    position:fixed;left:50%;bottom:26px;

<div class="vswitch">
  <span class="vswitch-label">v33 方案</span>
  <a href="../1-chatgpt/" class="vs-btn">1 · ChatGPT 极简</a>
  <a href="../2-content-flow/" class="vs-btn">2 · 对话 + 内容流</a>
  <a href="../3-scenes/" class="vs-btn active">3 · 任务接续</a>
  <a href="../" class="vs-btn vs-home">总览 ↗</a>
</div>
<style>
  .vswitch{
    position:fixed;bottom:18px;left:50%;
    transform:translateX(-50%);z-index:9999;
    display:flex;align-items:center;gap:2px;
    padding:5px 7px;
    background:rgba(31,31,29,.88);
    backdrop-filter:blur(8px);
    border-radius:99px;
    box-shadow:0 12px 32px -16px rgba(0,0,0,.5);
    font-size:12px;
  }
  .vswitch-label{padding:0 9px 0 6px;color:rgba(255,254,250,.45);font-size:11px}
  .vs-btn{
    padding:6px 11px;border-radius:99px;
    color:rgba(255,254,250,.72);font-size:12px;font-weight:500;
    text-decoration:none;transition:all .12s ease;
  }
  .vs-btn:hover{color:#fffefa;background:rgba(255,254,250,.1)}
  .vs-btn.active{background:#fffefa;color:#1f1f1d;font-weight:600}
  .vs-home{margin-left:3px;padding-left:11px;border-left:1px solid rgba(255,254,250,.18);color:rgba(255,254,250,.55)}
  @media (max-width:640px){
    .vswitch{flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);border-radius:14px}
    .vswitch-label{display:none}
  }
</style>

<script>
  const promptEl = document.getElementById('prompt');
  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  document.querySelectorAll('[data-fill]').forEach((b) => {
    b.addEventListener('click', () => {
      promptEl.value = b.dataset.fill;
      promptEl.focus();
    });
  });
  document.querySelectorAll('[data-toast]').forEach((b) => {
    b.addEventListener('click', () => showToast(b.dataset.toast));
  });
  document.querySelectorAll('.nav-item').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      b.classList.add('active');
    });
  });
  document.getElementById('send').addEventListener('click', () => {
    const text = promptEl.value.trim();
    if(!text){ showToast('先说一件想做的事'); promptEl.focus(); return; }
    showToast('已开始处理，这次过程会留在历史对话里');
  });
  promptEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)) document.getElementById('send').click();
  });

  // 来源 tabs 切换 active
  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(i => i.classList.remove('active'));
      t.classList.add('active');
      showToast('切换到「' + t.textContent.trim().replace(/\s+\d.*$/,'') + '」');
    });
  });

  // 滚屏：大对话框收起 + 底部紧凑对话框出现
  // 用滞回阈值（enter 220, leave 24）避免阈值附近来回抖动
  const mainEl = document.querySelector('.main');
  const ENTER_AT = 220;
  const LEAVE_AT = 24;
  let lastScrolled = false;
  let pending = false;
  function onScroll(){
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const st = mainEl.scrollTop;
      const next = lastScrolled ? (st > LEAVE_AT) : (st > ENTER_AT);
      if (next !== lastScrolled){
        lastScrolled = next;
        mainEl.classList.toggle('scrolled', next);
        document.body.classList.toggle('scrolled', next);
      }
    });
  }
  mainEl.addEventListener('scroll', onScroll, { passive:true });

  // 底部紧凑对话框
  const floatPrompt = document.getElementById('floatPrompt');
  const floatSend = document.getElementById('floatSend');
  floatSend.addEventListener('click', () => {
    const text = floatPrompt.value.trim();
    if(!text){ showToast('先说一件想做的事'); floatPrompt.focus(); return; }
    showToast('已开始处理，这次过程会留在历史对话里');
    floatPrompt.value = '';
  });
  floatPrompt.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); floatSend.click(); }
  });
</script>
