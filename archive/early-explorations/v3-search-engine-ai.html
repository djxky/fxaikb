<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞象 AI - 专属教育大脑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #111827;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 极度克制的高级背景，类似苹果官网的呼吸感 */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(240, 244, 255, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(245, 240, 255, 0.4) 0%, transparent 50%);
            filter: blur(60px);
            pointer-events: none;
        }

        /* 居中大搜索框的阴影与聚焦动效 */
        .omni-search-container {
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05);
            background: white;
        }
        .omni-search-container:focus-within {
            box-shadow: 0 12px 40px -8px rgba(0, 99, 235, 0.12), 0 0 0 3px rgba(37, 99, 235, 0.05);
            border-color: rgba(37, 99, 235, 0.2);
            transform: translateY(-2px);
        }

        /* 知识库状态的微动效 */
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: #10B981;
            position: relative;
        }
        .status-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background-color: #10B981;
            opacity: 0.3;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* 平滑滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-blue-100 selection:text-blue-900">

    <div class="ambient-bg"></div>

    <!-- 极简导航，去除了所有多余信息，只保留账号与底层管理 -->
    <nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-md border-b border-gray-100 transition-all">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <!-- Logo区 -->
            <div class="flex items-center gap-2.5 cursor-pointer">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-sm">
                    <i class="ph-bold ph-flying-saucer text-white text-lg"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900 tracking-tight">飞象 AI</span>
            </div>
            
            <!-- 管理区 (局端/校长关注的开通与数据) -->
            <div class="flex items-center gap-5">
                <button class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors flex items-center gap-1.5">
                    <i class="ph-bold ph-buildings"></i> 学校授权与数据
                </button>
                <div class="w-1px h-4 bg-gray-200"></div>
                <button class="w-9 h-9 rounded-full bg-gradient-to-tr from-gray-100 to-gray-200 border border-gray-200 flex items-center justify-center text-gray-700 font-semibold shadow-sm hover:shadow transition-all">
                    李
                </button>
            </div>
        </div>
    </nav>

    <!-- 主视觉与搜索区 (Google/ChatGPT 心智模型) -->
    <main class="flex-1 flex flex-col items-center pt-32 pb-20 px-4 z-10 w-full">
        
        <!-- 亲切的问候 -->
        <div class="text-center mb-10 w-full max-w-3xl">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4 tracking-tight">
                你好，李老师
            </h1>
            <p class="text-lg text-gray-500 font-medium">今天需要我帮你完成什么教学工作？</p>
        </div>

        <!-- 核心全能搜索框 -->
        <div class="w-full max-w-3xl relative z-20 mb-12">
            <div class="omni-search-container rounded-[24px] p-2 flex flex-col">
                <textarea 
                    class="w-full bg-transparent border-none outline-none resize-none p-4 text-[17px] text-gray-800 placeholder-gray-400 leading-relaxed font-medium" 
                    rows="2"
                    placeholder="输入指令... 例如：基于校本题库，帮我出一份五年级下册数学期中模拟卷"
                ></textarea>
                
                <div class="flex justify-between items-center px-2 pb-2 mt-1">
                    <!-- 左侧：语境与数据源 (核心护城河) -->
                    <div class="flex flex-wrap items-center gap-2">
                        <button class="hover:bg-gray-100 text-gray-500 hover:text-gray-900 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 text-sm font-medium" title="上传本地文件">
                            <i class="ph-bold ph-paperclip text-lg"></i>
                            <span class="hidden sm:inline">传文件</span>
                        </button>
                        
                        <!-- 知识库连接状态指示器 (直观展示“数据大脑”已就绪) -->
                        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-green-50/50 border border-green-100 text-green-700 text-sm font-medium cursor-pointer hover:bg-green-50 transition-colors">
                            <div class="status-dot"></div>
                            <i class="ph-fill ph-books"></i> 
                            已连接：个人与校本知识库
                        </div>
                    </div>
                    
                    <!-- 右侧：发送与语音 -->
                    <div class="flex items-center gap-2">
                        <button class="w-10 h-10 rounded-full hover:bg-gray-100 text-gray-500 hover:text-blue-600 flex items-center justify-center transition-colors">
                            <i class="ph-fill ph-microphone text-xl"></i>
                        </button>
                        <button class="w-10 h-10 rounded-full bg-blue-600 text-white hover:bg-blue-700 flex items-center justify-center transition-transform hover:scale-105 shadow-sm">
                            <i class="ph-bold ph-arrow-up text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 搜索框下方的建议气泡 (降低上手门槛) -->
            <div class="flex flex-wrap justify-center gap-2.5 mt-6">
                <button class="px-4 py-2 rounded-full border border-gray-200 bg-white text-sm font-medium text-gray-600 hover:border-blue-300 hover:text-blue-600 transition-colors flex items-center gap-1.5 shadow-sm">
                    <i class="ph-fill ph-pencil-simple text-blue-500"></i> 批改昨日三年级作文
                </button>
                <button class="px-4 py-2 rounded-full border border-gray-200 bg-white text-sm font-medium text-gray-600 hover:border-blue-300 hover:text-blue-600 transition-colors flex items-center gap-1.5 shadow-sm">
                    <i class="ph-fill ph-chart-polar text-purple-500"></i> 分析上周数学周测学情
                </button>
                <button class="px-4 py-2 rounded-full border border-gray-200 bg-white text-sm font-medium text-gray-600 hover:border-blue-300 hover:text-blue-600 transition-colors flex items-center gap-1.5 shadow-sm">
                    <i class="ph-fill ph-presentation-chart text-green-500"></i> 生成光合作用 PPT 课件
                </button>
            </div>
        </div>

        <!-- 数据底座展示 (向老师和校长秀出肌肉) -->
        <div class="w-full max-w-4xl mb-16">
            <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 px-2">飞象数据引擎</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 个人知识库 -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] flex items-center justify-between group cursor-pointer hover:border-blue-200 transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 group-hover:scale-105 transition-transform">
                            <i class="ph-fill ph-user-circle text-2xl"></i>
                        </div>
                        <div>
                            <h4 class="text-base font-bold text-gray-900 mb-0.5">我的专属 AI 大脑</h4>
                            <p class="text-xs text-gray-500">已学习您的 124 份教案与试卷</p>
                        </div>
                    </div>
                    <button class="text-blue-600 text-sm font-medium px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-colors">
                        上传资料
                    </button>
                </div>

                <!-- 校本资源库 -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] flex items-center justify-between group cursor-pointer hover:border-purple-200 transition-colors relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-32 h-32 bg-purple-50 rounded-full blur-2xl opacity-50"></div>
                    <div class="flex items-center gap-4 relative z-10">
                        <div class="w-12 h-12 rounded-xl bg-purple-50 flex items-center justify-center text-purple-600 group-hover:scale-105 transition-transform">
                            <i class="ph-fill ph-bank text-2xl"></i>
                        </div>
                        <div>
                            <h4 class="text-base font-bold text-gray-900 mb-0.5">校本资源知识库</h4>
                            <p class="text-xs text-gray-500">全校共享的 15,200 份结构化资源</p>
                        </div>
                    </div>
                    <button class="text-purple-600 text-sm font-medium px-3 py-1.5 rounded-lg hover:bg-purple-50 transition-colors relative z-10">
                        探索题库
                    </button>
                </div>
            </div>
        </div>

        <!-- 原子能力集市 (克制的商业化展示) -->
        <div class="w-full max-w-4xl">
            <div class="flex justify-between items-end mb-4 px-2">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider">AI 原子能力大厅</h3>
                <a href="#" class="text-sm font-medium text-blue-600 hover:text-blue-700 flex items-center gap-1">管理我的应用 <i class="ph-bold ph-caret-right"></i></a>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                
                <!-- 已授权能力 -->
                <div class="bg-white rounded-2xl p-4 border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all cursor-pointer group flex flex-col justify-between min-h-[140px]">
                    <div class="flex justify-between items-start">
                        <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center mb-3">
                            <i class="ph-fill ph-magic-wand text-xl"></i>
                        </div>
                        <i class="ph-fill ph-check-circle text-green-500 text-sm" title="已授权"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-900 mb-1">智能组卷与推题</h4>
                        <p class="text-[12px] text-gray-500 line-clamp-2">基于学情和考纲，一键生成高质量复习卷。</p>
                    </div>
                </div>

                <!-- 已授权能力 -->
                <div class="bg-white rounded-2xl p-4 border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all cursor-pointer group flex flex-col justify-between min-h-[140px]">
                    <div class="flex justify-between items-start">
                        <div class="w-10 h-10 rounded-lg bg-orange-50 text-orange-600 flex items-center justify-center mb-3">
                            <i class="ph-fill ph-pencil-simple text-xl"></i>
                        </div>
                        <i class="ph-fill ph-check-circle text-green-500 text-sm" title="已授权"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-900 mb-1">作业作文批改</h4>
                        <p class="text-[12px] text-gray-500 line-clamp-2">多维度评语、润色建议与范文对比。</p>
                    </div>
                </div>

                <!-- 已授权能力 -->
                <div class="bg-white rounded-2xl p-4 border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all cursor-pointer group flex flex-col justify-between min-h-[140px]">
                    <div class="flex justify-between items-start">
                        <div class="w-10 h-10 rounded-lg bg-green-50 text-green-600 flex items-center justify-center mb-3">
                            <i class="ph-fill ph-presentation-chart text-xl"></i>
                        </div>
                        <i class="ph-fill ph-check-circle text-green-500 text-sm" title="已授权"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-900 mb-1">一键课件生成</h4>
                        <p class="text-[12px] text-gray-500 line-clamp-2">输入课题，自动生成带排版和动画的 PPT。</p>
                    </div>
                </div>

                <!-- 未授权能力 (引导申请) -->
                <div class="bg-gray-50/50 rounded-2xl p-4 border border-dashed border-gray-200 relative overflow-hidden group cursor-pointer min-h-[140px] flex flex-col justify-between">
                    <div class="flex justify-between items-start opacity-60">
                        <div class="w-10 h-10 rounded-lg bg-gray-200 text-gray-500 flex items-center justify-center mb-3">
                            <i class="ph-fill ph-chart-pie-slice text-xl"></i>
                        </div>
                        <i class="ph-fill ph-lock-key text-gray-400 text-sm" title="未授权"></i>
                    </div>
                    <div class="opacity-60 group-hover:opacity-20 transition-opacity">
                        <h4 class="text-sm font-bold text-gray-900 mb-1">学情与错因分析</h4>
                        <p class="text-[12px] text-gray-500 line-clamp-2">深度分析考试数据，生成班级雷达图。</p>
                    </div>
                    
                    <!-- 悬浮解锁提示 -->
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-white/80 backdrop-blur-[2px]">
                        <button class="bg-gray-900 text-white text-[13px] font-medium px-4 py-2 rounded-full shadow-sm hover:scale-105 transition-transform">
                            向学校申请开通
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- 多人评论层：先在 Supabase SQL Editor 执行 supabase-comments.sql，再填入项目配置 -->
    <script>
        window.PIN_COMMENTS_SUPABASE = {
            url: '',
            anonKey: ''
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./pin-comments.js"></script>
</body>
</html>
